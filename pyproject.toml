[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nao-says"
version = "0.1.0"
description = "NAO interaction and vision pipeline"
requires-python = ">=3.9"

dependencies = [
    "opencv-python",
    "numpy",
    "ultralytics",
    "onnxruntime",
    "huggingface-hub",
    "faster-whisper",
    "pyaudio",
]

[project.scripts]
nao-run = "nao_says.execute:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]